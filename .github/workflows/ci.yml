name: CI

# El deploy a Pages solo corre en push a main: si el build rompe ahí, el
# sitio se queda servido en su versión anterior y no hay ninguna señal
# hasta que alguien nota que su cambio no aparece. Este workflow compila
# antes, en el pull request, para que eso se vea a tiempo.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
